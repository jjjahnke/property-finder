# A generic, single database configuration for Kubernetes.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

# database URL for Kubernetes. This points to the locally port-forwarded service.
sqlalchemy.url = postgresql://user:password@127.0.0.1:5433/property_finder

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
